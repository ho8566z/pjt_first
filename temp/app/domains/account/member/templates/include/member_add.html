<div class="member_add_box">

    <h2>회원 등록</h2>

    <form method="post" action="/member/add">

        <div class="add_row">
            <label>아이디</label>
            <input
                type="text"
                name="id"
                value="{{ member_data.id if member_data else '' }}">
            
            {% if error_field == "id" %}
                <p class="error">{{ error_message }}</p>
            {% endif %}
        </div>

        <div class="add_row">
            <label>비밀번호</label>
            <input type="password" name="pw">
            {% if error_field == "pw" %}
                <p class="error">{{ error_message }}</p>
            {% endif %}
        </div>

        <div class="add_row">
            <label>이름</label>
            <input type="text" name="name">
        </div>

        {% include "include/member_add_phone.html" %}
        

        <div class="add_row">
            <label>이메일</label>
            <input
                type="text"
                name="email"
                value="{{ member_data.email if member_data else '' }}">
            {% if error_field == "email" %}
                <p class="error">{{ error_message }}</p>
            {% endif %}
        </div>

        <div class="add_row">
            <label>역할</label>
            <select name="permission">
                <option value="ADMIN">관리자</option>
                <option value="OBSERVER">관제자</option>
            </select>
        </div>

        <div class="btn_area">
            <button class="save_btn" type="submit">등록</button>
            <a class="cancel_btn" href="/member/list">취소</a>
        </div>

    </form>

</div>
