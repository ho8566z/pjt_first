<form method="GET" class="filter_box">

    <div class="filter_row">

        <!-- 검색 -->
        <div class="search_box">
            <input type="text" name="keyword" value="{{ keyword }}" placeholder="검색어 입력">
            <button type="submit">🔍</button>
        </div>

        <!-- 검색 대상 -->
        <label>태그</label>
        <select name="tag">
            <option value="전체" {% if tag=="전체" %}selected{% endif %}>
                전체
            </option>

            <option value="이벤트ID" {% if tag=="이벤트ID" %}selected{% endif %}>
                이벤트ID
            </option>

            <option value="대상ID" {% if tag=="대상ID" %}selected{% endif %}>
                대상ID
            </option>

            <option value="발생시간" {% if tag=="발생시간" %}selected{% endif %}>
                발생시간
            </option>
        </select>

        <!-- 읽음 여부 -->
        <label>읽음 여부</label>
        <select name="status">
            <option value="전체" {% if status=="전체" %}selected{% endif %}>
                전체
            </option>

            <option value="읽음" {% if status=="읽음" %}selected{% endif %}>
                읽음
            </option>

            <option value="읽지않음" {% if status=="읽지않음" %}selected{% endif %}>
                읽지않음
            </option>
        </select>


        <!-- 정렬 -->
        <label>정렬</label>
        <select name="sort">
            <option value="최신순" {% if sort=="최신순" %}selected{% endif %}>
                최신순
            </option>

            <option value="오래된순" {% if sort=="오래된순" %}selected{% endif %}>
                오래된순
            </option>
        </select>


        <!-- 페이지 -->
        <label>보기</label>
        <select name="per_page">
            <option value="10" {% if per_page==10 %}selected{% endif %}>
                10개
            </option>

            <option value="20" {% if per_page==20 %}selected{% endif %}>
                20개
            </option>

            <option value="50" {% if per_page==50 %}selected{% endif %}>
                50개
            </option>
        </select>


        <button type="submit" class="filter_btn">적용</button>

    </div>

</form>
