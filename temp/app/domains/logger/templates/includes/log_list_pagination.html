<div class="pagination_wrap">

    <div class="pagination">

        {% if page > 1 %}
            <a href="?page={{ page-1 }}&per_page={{ per_page }}">◀</a>
        {% endif %}

        {% for p in range(1,total_pages+1) %}

            {% if p == page %}
                <strong>{{ p }}</strong>
            {% else %}
                <a href="?page={{ p }}&per_page={{ per_page }}">{{ p }}</a>
            {% endif %}

        {% endfor %}

        {% if page < total_pages %}
            <a href="?page={{ page+1 }}&per_page={{ per_page }}">▶</a>
        {% endif %}

    </div>

</div>
